<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Herramientas</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #10b981;
      --primary-hover: #059669;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); }

    header {
      background: #0b1120;
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .header-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    header h1 { margin: 0; font-size: 1.12rem; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .badge-live {
      background: rgba(16, 185, 129, 0.15);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .badge-admin {
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      border: 1px solid rgba(245, 158, 11, 0.45);
      display: none;
    }
    .badge-admin.active { display: inline-block; }
    .status-text { font-size: 0.78rem; color: var(--muted); }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .field-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .admin-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding-left: 10px;
      border-left: 1px solid var(--border);
    }
    .admin-tools {
      display: none;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .admin-tools.unlocked { display: inline-flex; }

    button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.84rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.15s, background 0.15s, transform 0.08s;
    }
    button:hover { border-color: var(--muted); }
    button:active { transform: scale(0.99); }

    button.btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #05251b;
      font-weight: 700;
      padding: 9px 14px;
    }
    button.btn-primary:hover { background: var(--primary-hover); }

    button.btn-lutocar {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(248, 113, 113, 0.65);
      color: #fca5a5;
      font-weight: 700;
      padding: 9px 14px;
    }
    button.btn-lutocar:hover {
      background: rgba(239, 68, 68, 0.3);
      border-color: #f87171;
    }

    button.btn-admin-toggle {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.4);
      color: #fcd34d;
      font-size: 0.78rem;
      padding: 6px 10px;
    }
    button.btn-admin-toggle.unlocked {
      background: rgba(16, 185, 129, 0.16);
      border-color: rgba(16, 185, 129, 0.5);
      color: #6ee7b7;
    }

    button.info {
      background: rgba(59, 130, 246, 0.18);
      border-color: rgba(59, 130, 246, 0.5);
      color: #93c5fd;
    }

    .container { max-width: 1450px; margin: 0 auto; padding: 16px; }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px;
    }
    .kpi .label { font-size: 0.76rem; color: var(--muted); }
    .kpi .val { font-size: 1.55rem; font-weight: 700; margin: 4px 0; }
    .kpi .sub { font-size: 0.74rem; color: var(--muted); }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 16px;
      overflow-x: auto;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      min-width: 600px;
    }
    .summary-table th, .summary-table td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid rgba(51, 65, 85, 0.55);
      text-align: center;
    }
    .summary-table th:last-child, .summary-table td:last-child { border-right: none; }
    .summary-table th { background: #162032; color: var(--muted); font-size: 0.76rem; text-transform: uppercase; }
    .summary-table td:first-child, .summary-table th:first-child { text-align: left; }
    .summary-table td:first-child { font-weight: 700; background: rgba(22, 32, 50, 0.45); }
    .summary-table tr.total-row td { background: #131d2e; font-weight: 700; color: #34d399; border-bottom: none; }
    .summary-table tr.total-row td:first-child { color: var(--text); }

    .filters {
      display: grid;
      grid-template-columns: 1.5fr repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    @media (max-width: 1120px) {
      .filters { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 560px) {
      .filters { grid-template-columns: 1fr; }
    }

    input, select, textarea {
      width: 100%;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 0.88
